<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>산출물 의존 관계도 - Interactive Hover Map</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: rgba(255, 255, 255, 0.92);
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --focus: #dc2626;
      --target: #f59e0b;
      --incoming: #0ea5e9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 58px 1fr;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(330px, max-content) minmax(320px, 520px);
      gap: 14px;
      align-items: center;
      height: 58px;
      min-height: 58px;
      max-height: 58px;
      padding: 0 14px;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(8px);
    }

    .toolbar > div {
      min-width: 0;
    }

    .toolbar > div:first-child {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .toolbar strong {
      font-size: 14px;
      white-space: nowrap;
    }

    .toolbar .hint {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      overflow: hidden;
      white-space: nowrap;
      font-size: 12px;
      color: var(--muted);
    }

    .controls span {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .controls label {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .status {
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #334155;
      font-size: 12px;
      text-align: right;
    }

    .viewport {
      overflow: auto;
      padding: 16px;
      scrollbar-gutter: stable both-edges;
    }

    .canvas {
      min-width: 1200px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      contain: layout paint;
    }

    svg.dependency-map {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }

    svg.dependency-map text { pointer-events: none; }
    svg.dependency-map rect.interactive-node { pointer-events: none; }
    svg.dependency-map rect.step-container { pointer-events: none; }
    svg.dependency-map .hover-layer { pointer-events: all; }
    svg.dependency-map .hover-hit {
      fill: transparent;
      stroke: transparent;
      opacity: 0;
      pointer-events: all;
      cursor: pointer;
    }

    svg.dependency-map .dimmed { opacity: 0.11 !important; }
    svg.dependency-map .dimmed-weak { opacity: 0.20 !important; }

    svg.dependency-map .node-source {
      opacity: 1 !important;
      stroke: var(--focus) !important;
      stroke-width: 3.6 !important;
      filter: drop-shadow(0 0 4px rgba(220, 38, 38, 0.55));
    }

    svg.dependency-map .node-target {
      opacity: 1 !important;
      stroke: var(--target) !important;
      stroke-width: 3.2 !important;
      filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.50));
    }

    svg.dependency-map .node-incoming {
      opacity: 1 !important;
      stroke: var(--incoming) !important;
      stroke-width: 2.8 !important;
      filter: drop-shadow(0 0 3px rgba(14, 165, 233, 0.45));
    }

    svg.dependency-map .label-source,
    svg.dependency-map .label-target,
    svg.dependency-map .label-incoming {
      opacity: 1 !important;
      font-weight: 800 !important;
      fill: #0f172a !important;
    }

    svg.dependency-map .edge-focus {
      opacity: 1 !important;
      stroke: var(--edge-highlight, var(--focus)) !important;
      stroke-width: 4.0 !important;
      filter: var(--edge-filter, drop-shadow(0 0 4px rgba(220, 38, 38, 0.55)));
    }

    svg.dependency-map .edge-incoming {
      opacity: 1 !important;
      stroke: var(--edge-highlight, var(--incoming)) !important;
      stroke-width: 3.2 !important;
      filter: var(--edge-filter, drop-shadow(0 0 3px rgba(14, 165, 233, 0.45)));
    }

    svg.dependency-map .dot-focus {
      opacity: 1 !important;
      fill: var(--edge-highlight, var(--focus)) !important;
      r: 4;
      filter: var(--edge-filter, drop-shadow(0 0 4px rgba(220, 38, 38, 0.55)));
    }

    svg.dependency-map .dot-incoming {
      opacity: 1 !important;
      fill: var(--edge-highlight, var(--incoming)) !important;
      r: 3.5;
    }

    @media (max-width: 1100px) {
      .app { grid-template-rows: 64px 1fr; }
      .toolbar {
        grid-template-columns: minmax(280px, 1fr) minmax(220px, 300px) minmax(220px, 320px);
        height: 64px;
        min-height: 64px;
        max-height: 64px;
      }
      .toolbar .hint { display: none; }
      .canvas { min-width: 1000px; }
    }
  </style>
</head>

  <script>
    (function () {
      const svg = document.getElementById('diagramSvg');
      const statusEl = document.getElementById('status');
      const incomingToggle = document.getElementById('incomingToggle');
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const stepContainerIds = new Set([
        'rect14', 'rect15', 'rect16', 'rect17', 'rect18', 'rect19',
        'rect20', 'rect21', 'rect22', 'rect23', 'rect24', 'rect25'
      ]);

      const cleanLabel = (s) => (s || '').replace(/\s+/g, ' ').trim();
      const num = (el, attr) => parseFloat(el.getAttribute(attr) || '0');

      function rectBox(rect) {
        return {
          x: num(rect, 'x'),
          y: num(rect, 'y'),
          w: num(rect, 'width'),
          h: num(rect, 'height'),
        };
      }

      function pointRectDistance(p, b) {
        const dx = Math.max(b.x - p.x, 0, p.x - (b.x + b.w));
        const dy = Math.max(b.y - p.y, 0, p.y - (b.y + b.h));
        return Math.sqrt(dx * dx + dy * dy);
      }

      function pointInsideRect(p, b) {
        return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
      }

      function textPoint(text) {
        return { x: num(text, 'x'), y: num(text, 'y') };
      }

      const allTexts = Array.from(svg.querySelectorAll('text'));
      const allRects = Array.from(svg.querySelectorAll('rect'));
      const allCircles = Array.from(svg.querySelectorAll('circle'));
      const allPaths = Array.from(svg.querySelectorAll('path')).filter(p => p.hasAttribute('marker-end'));

      const actionNodes = allRects
        .filter(rect => {
          const id = rect.id;
          const b = rectBox(rect);
          if (!id || id === 'rect13') return false;
          if (stepContainerIds.has(id)) return false;
          if (b.w < 60 || b.h < 25) return false;
          return true;
        })
        .map(rect => {
          const b = rectBox(rect);
          const labels = allTexts.filter(t => {
            const p = textPoint(t);
            return p.x >= b.x - 2 && p.x <= b.x + b.w + 2 && p.y >= b.y - 3 && p.y <= b.y + b.h + 18;
          });
          const label = cleanLabel(labels.map(t => t.textContent).join(' '));
          rect.classList.add('interactive-node');
          return { rect, box: b, labels, id: rect.id, label };
        });

      const stepNodes = allRects
        .filter(rect => stepContainerIds.has(rect.id))
        .map(rect => {
          const b = rectBox(rect);
          const labels = allTexts.filter(t => {
            const p = textPoint(t);
            return p.x >= b.x - 2 && p.x <= b.x + b.w + 2 && p.y >= b.y - 3 && p.y <= b.y + 26;
          });
          const label = cleanLabel(labels.map(t => t.textContent).join(' '));
          const children = actionNodes.filter(n => {
            const c = { x: n.box.x + n.box.w / 2, y: n.box.y + n.box.h / 2 };
            return pointInsideRect(c, b);
          });
          rect.classList.add('step-container');
          return { rect, box: b, labels, id: rect.id, label, children };
        });

      function nearestActionNode(point, threshold = 58) {
        let best = null;
        let bestDistance = Infinity;
        for (const node of actionNodes) {
          const d = pointRectDistance(point, node.box);
          if (d < bestDistance) {
            best = node;
            bestDistance = d;
          }
        }
        return bestDistance <= threshold ? best : null;
      }

      const defs = svg.querySelector('defs');
      const markerCache = new Map();

      function nodeStrokeColor(node, fallback = '#dc2626') {
        if (!node || !node.rect) return fallback;
        return node.rect.getAttribute('stroke') || getComputedStyle(node.rect).stroke || fallback;
      }

      function normalizeColor(color, fallback = '#dc2626') {
        if (!color) return fallback;
        const trimmed = String(color).trim();
        if (/^#[0-9a-fA-F]{3}$/.test(trimmed)) {
          return '#' + trimmed.slice(1).split('').map(ch => ch + ch).join('');
        }
        if (/^#[0-9a-fA-F]{6}$/.test(trimmed)) return trimmed;
        const rgb = trimmed.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
        if (rgb) {
          return '#' + [rgb[1], rgb[2], rgb[3]].map(v => Math.max(0, Math.min(255, Number(v))).toString(16).padStart(2, '0')).join('');
        }
        return fallback;
      }

      function rgbaFromHex(color, alpha = 0.5) {
        const hex = normalizeColor(color).replace('#', '');
        const r = parseInt(hex.slice(0, 2), 16);
        const g = parseInt(hex.slice(2, 4), 16);
        const b = parseInt(hex.slice(4, 6), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function markerForColor(color, role) {
        const normalized = normalizeColor(color, role === 'incoming' ? '#0ea5e9' : '#dc2626');
        const key = `${role}-${normalized}`;
        if (markerCache.has(key)) return markerCache.get(key);

        const isIncoming = role === 'incoming';
        const id = `arDyn_${role}_${normalized.replace('#', '')}`;
        const marker = document.createElementNS(SVG_NS, 'marker');
        marker.setAttribute('id', id);
        marker.setAttribute('markerWidth', isIncoming ? '3.92' : '4.48');
        marker.setAttribute('markerHeight', isIncoming ? '3.92' : '4.48');
        marker.setAttribute('refX', isIncoming ? '3.56' : '4.08');
        marker.setAttribute('refY', isIncoming ? '1.792' : '2.048');
        marker.setAttribute('orient', 'auto');
        marker.setAttribute('markerUnits', 'strokeWidth');

        const arrow = document.createElementNS(SVG_NS, 'path');
        arrow.setAttribute('d', isIncoming ? 'M 0,0 3.92,1.792 0,3.584 Z' : 'M 0,0 4.48,2.048 0,4.096 Z');
        arrow.setAttribute('fill', normalized);
        marker.appendChild(arrow);
        defs.appendChild(marker);

        const ref = `url(#${id})`;
        markerCache.set(key, ref);
        return ref;
      }

      function edgeDots(edge) {
        const result = [];
        for (const c of allCircles) {
          const cx = num(c, 'cx'), cy = num(c, 'cy');
          const d0 = Math.hypot(cx - edge.start.x, cy - edge.start.y);
          const d1 = Math.hypot(cx - edge.end.x, cy - edge.end.y);
          if (d0 <= 16 || d1 <= 8) result.push(c);
        }
        return result;
      }

      const edges = allPaths.map(path => {
        let start = null;
        let end = null;
        try {
          const len = path.getTotalLength();
          const s = path.getPointAtLength(0);
          const e = path.getPointAtLength(len);
          start = { x: s.x, y: s.y };
          end = { x: e.x, y: e.y };
        } catch (e) {
          return null;
        }
        const source = nearestActionNode(start);
        const target = nearestActionNode(end);
        const edge = {
          path,
          start,
          end,
          source,
          target,
          dots: [],
          originalMarkerEnd: path.getAttribute('marker-end') || ''
        };
        edge.dots = edgeDots(edge);
        return edge;
      }).filter(Boolean);

      const sourceIndex = new Map();
      const targetIndex = new Map();
      for (const edge of edges) {
        if (edge.source) {
          if (!sourceIndex.has(edge.source.id)) sourceIndex.set(edge.source.id, []);
          sourceIndex.get(edge.source.id).push(edge);
        }
        if (edge.target) {
          if (!targetIndex.has(edge.target.id)) targetIndex.set(edge.target.id, []);
          targetIndex.get(edge.target.id).push(edge);
        }
      }

      function clearClasses() {
        for (const el of [...allRects, ...allTexts, ...allPaths, ...allCircles]) {
          el.classList.remove(
            'dimmed', 'dimmed-weak',
            'node-source', 'node-target', 'node-incoming',
            'label-source', 'label-target', 'label-incoming',
            'edge-focus', 'edge-incoming', 'dot-focus', 'dot-incoming'
          );
        }
        for (const edge of edges) {
          edge.path.setAttribute('marker-end', edge.originalMarkerEnd);
          edge.path.style.removeProperty('--edge-highlight');
          edge.path.style.removeProperty('--edge-filter');
        }
        for (const c of allCircles) {
          c.style.removeProperty('--edge-highlight');
          c.style.removeProperty('--edge-filter');
        }
        statusEl.textContent = '대기 중';
      }

      function dimDiagram() {
        for (const edge of edges) edge.path.classList.add('dimmed');
        for (const c of allCircles) c.classList.add('dimmed');
        for (const node of actionNodes) {
          node.rect.classList.add('dimmed-weak');
          for (const t of node.labels) t.classList.add('dimmed-weak');
        }
        for (const step of stepNodes) {
          step.rect.classList.add('dimmed-weak');
          for (const t of step.labels) t.classList.add('dimmed-weak');
        }
      }

      function markNode(node, role) {
        if (!node) return;
        node.rect.classList.remove('dimmed', 'dimmed-weak');
        node.rect.classList.add(role === 'source' ? 'node-source' : role === 'incoming' ? 'node-incoming' : 'node-target');
        for (const t of node.labels) {
          t.classList.remove('dimmed', 'dimmed-weak');
          t.classList.add(role === 'source' ? 'label-source' : role === 'incoming' ? 'label-incoming' : 'label-target');
        }
      }

      function markStep(step) {
        step.rect.classList.remove('dimmed', 'dimmed-weak');
        step.rect.classList.add('node-source');
        for (const t of step.labels) {
          t.classList.remove('dimmed', 'dimmed-weak');
          t.classList.add('label-source');
        }
      }

      function markEdge(edge, role, color) {
        const highlightColor = normalizeColor(color, role === 'incoming' ? '#0ea5e9' : '#dc2626');
        const highlightFilter = `drop-shadow(0 0 ${role === 'incoming' ? '3px' : '4px'} ${rgbaFromHex(highlightColor, role === 'incoming' ? 0.45 : 0.55)})`;

        edge.path.classList.remove('dimmed', 'dimmed-weak');
        edge.path.classList.add(role === 'incoming' ? 'edge-incoming' : 'edge-focus');
        edge.path.style.setProperty('--edge-highlight', highlightColor);
        edge.path.style.setProperty('--edge-filter', highlightFilter);
        edge.path.setAttribute('marker-end', markerForColor(highlightColor, role));
        for (const c of edge.dots) {
          c.classList.remove('dimmed', 'dimmed-weak');
          c.classList.add(role === 'incoming' ? 'dot-incoming' : 'dot-focus');
          c.style.setProperty('--edge-highlight', highlightColor);
          c.style.setProperty('--edge-filter', highlightFilter);
        }
      }

      function focusActionNode(node) {
        clearClasses();
        dimDiagram();
        markNode(node, 'source');

        const outgoing = sourceIndex.get(node.id) || [];
        const incoming = incomingToggle.checked ? (targetIndex.get(node.id) || []) : [];
        const targets = new Map();
        const sources = new Map();

        const selectedColor = nodeStrokeColor(node);
        for (const edge of outgoing) {
          markEdge(edge, 'outgoing', selectedColor);
          if (edge.target) targets.set(edge.target.id, edge.target);
        }
        for (const edge of incoming) {
          markEdge(edge, 'incoming', nodeStrokeColor(edge.source, selectedColor));
          if (edge.source) sources.set(edge.source.id, edge.source);
        }
        for (const target of targets.values()) markNode(target, 'target');
        for (const source of sources.values()) markNode(source, 'incoming');

        const targetLabels = Array.from(targets.values()).map(n => n.label).filter(Boolean);
        const incomingText = incomingToggle.checked && sources.size
          ? ` · 입력 ${sources.size}개`
          : '';
        statusEl.textContent = `${node.label || node.id} → ${targetLabels.length ? targetLabels.join(', ') : '직접 목적지 없음'}${incomingText}`;
      }

      function focusStep(step) {
        clearClasses();
        dimDiagram();
        markStep(step);

        const outgoingEdges = [];
        const targetMap = new Map();
        for (const child of step.children) {
          markNode(child, 'source');
          const out = sourceIndex.get(child.id) || [];
          for (const edge of out) {
            outgoingEdges.push(edge);
            markEdge(edge, 'outgoing', nodeStrokeColor(child, nodeStrokeColor(step)));
            if (edge.target) targetMap.set(edge.target.id, edge.target);
          }
        }
        for (const target of targetMap.values()) markNode(target, 'target');

        statusEl.textContent = `${step.label || step.id} · 하위 산출물 ${step.children.length}개 · 출력 화살표 ${outgoingEdges.length}개 · 목적지 ${targetMap.size}개`;
      }

      function makeHitRect(node, kind, focusFn) {
        const pad = kind === 'step' ? 0 : 5;
        const hit = document.createElementNS(SVG_NS, 'rect');
        hit.setAttribute('x', String(node.box.x - pad));
        hit.setAttribute('y', String(node.box.y - pad));
        hit.setAttribute('width', String(node.box.w + pad * 2));
        hit.setAttribute('height', String(node.box.h + pad * 2));
        hit.setAttribute('rx', kind === 'step' ? '12' : '8');
        hit.setAttribute('ry', kind === 'step' ? '12' : '8');
        hit.setAttribute('class', `hover-hit hover-hit-${kind}`);
        hit.setAttribute('tabindex', '0');
        hit.setAttribute('aria-label', node.label || node.id);
        hit.addEventListener('mouseenter', () => focusFn(node));
        hit.addEventListener('focus', () => focusFn(node));
        hit.addEventListener('mouseleave', (event) => {
          const next = event.relatedTarget;
          if (!(next instanceof Element) || !next.classList.contains('hover-hit')) clearClasses();
        });
        hit.addEventListener('blur', clearClasses);
        return hit;
      }

      const hoverLayer = document.createElementNS(SVG_NS, 'g');
      hoverLayer.setAttribute('id', 'stableHoverLayer');
      hoverLayer.setAttribute('class', 'hover-layer');
      svg.appendChild(hoverLayer);

      // Step hit zones are appended first. Smaller action-node hit zones are appended later,
      // so action nodes win when a child box overlaps a step container.
      for (const step of stepNodes) hoverLayer.appendChild(makeHitRect(step, 'step', focusStep));
      for (const node of actionNodes) hoverLayer.appendChild(makeHitRect(node, 'node', focusActionNode));

      incomingToggle.addEventListener('change', () => clearClasses());
      svg.addEventListener('mouseleave', clearClasses);

      clearClasses();
    })();
  </script>
